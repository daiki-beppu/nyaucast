name: Set up tayk
description: Install the pinned Bun dependencies and expose the ni command family.
inputs:
  working-directory:
    description: Directory containing package.json
    required: false
    default: .
runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version-file: ${{ inputs.working-directory }}/package.json
    - name: Install dependencies with ni
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bunx --bun ni --frozen
