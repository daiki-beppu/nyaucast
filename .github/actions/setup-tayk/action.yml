name: Set up tayk
description: Install the pinned Bun dependencies.
inputs:
  working-directory:
    description: Directory containing package.json
    required: false
    default: .
runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version-file: ${{ inputs.working-directory }}/package.json
    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bun install --frozen-lockfile
    # 契約テストが起動する pin 済み CLI を先に取得しておく。テスト内で初回
    # ダウンロードが走ると、個々のテストのタイムアウトに乗ってしまう。
    - name: Warm the pinned takt CLI cache
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bunx --bun takt@0.52.0 --version
