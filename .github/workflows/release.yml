name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release commit is on main
        run: |
          git fetch origin main
          bash .github/scripts/check-release-ancestor.sh "$GITHUB_SHA" origin/main
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Install dependencies with frozen-lockfile
        run: nix develop --command bun install --frozen-lockfile
      - name: Publish package
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          # shellcheck disable=SC2016
          nix develop --command bash -euc '
            if [ "$DRY_RUN" = "true" ]; then
              npm publish --dry-run
              exit 0
            fi
            package_version=$(bun --print "require(\"./package.json\").version")
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$package_version" ]; then
              echo "tag version $tag_version does not match package version $package_version" >&2
              exit 1
            fi
            npm publish
          '
