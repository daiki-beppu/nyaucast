name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # fetch-depth: 0 が refs/remotes/origin/* を埋めるので追加の fetch は要らない。
      # persist-credentials: false で認証ヘッダが消えており、private リポでは
      # ここでネットワーク fetch を挟むと必ず認証エラーで publish 前に落ちる。
      - name: Verify release commit is on main
        run: bash .github/scripts/check-release-ancestor.sh "$GITHUB_SHA" origin/main
      # pnpm（packageManager）と Node（devEngines.runtime）を入れ、依存を install する。
      # require-lockfile で、lockfile が無いときも失敗させる（--frozen-lockfile 相当）。
      - name: Setup pnpm, Node and dependencies
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          require-lockfile: true
      # Trusted Publisher は stage publish のみ許可し、公開は npmjs.com でパスキー承認する。
      # タグ push の checkout は detached HEAD で pnpm の branch 検査が必ず落ちるため
      # --no-git-checks で外す。main 到達性は上の Verify ステップが担保している。
      - name: Publish package
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            pnpm stage publish --dry-run --no-git-checks
            exit 0
          fi
          package_version=$(node --print 'require("./package.json").version')
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" != "$package_version" ]; then
            echo "tag version $tag_version does not match package version $package_version" >&2
            exit 1
          fi
          pnpm stage publish --no-git-checks
