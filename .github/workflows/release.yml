name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # fetch-depth: 0 が refs/remotes/origin/* を埋めるので追加の fetch は要らない。
      # persist-credentials: false で認証ヘッダが消えており、private リポでは
      # ここでネットワーク fetch を挟むと必ず認証エラーで publish 前に落ちる。
      - name: Verify release commit is on main
        run: bash .github/scripts/check-release-ancestor.sh "$GITHUB_SHA" origin/main
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
      - name: Publish package
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          # shellcheck disable=SC2016
          nix develop --command bash -euc '
            if [ ! -d node_modules ]; then
              echo "node_modules is unavailable after entering the development shell" >&2
              exit 1
            fi
            if [ "$DRY_RUN" = "true" ]; then
              npm publish --dry-run
              exit 0
            fi
            package_version=$(bun --print "require(\"./package.json\").version")
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$package_version" ]; then
              echo "tag version $tag_version does not match package version $package_version" >&2
              exit 1
            fi
            npm publish
          '
