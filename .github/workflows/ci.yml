name: CI

on:
  pull_request: {}
  push: { branches: [main] }
  workflow_call: {}

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # concurrency は job 側に置く。workflow レベルに置くと workflow_call 経由の
    # 呼び出しでも評価され、release の group を掴んだまま待っている呼び出し元と
    # 同じ group を要求して deadlock する。group 名に ${{ github.workflow }} を
    # 使わないのも同じ理由で、called workflow では呼び出し元の workflow 名
    # （Release）へ解決され、group 名は大文字小文字を区別しない。
    concurrency:
      group: ci-quality-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
      # ゲート集合の定義は package.json の check script にのみ置く。ここで step へ
      # 割り戻すと列挙が複製され、CI とローカルが食い違う経路が再び開く。
      - name: Check
        run: nix develop --command bun run check
