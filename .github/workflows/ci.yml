name: CI

on:
  # paths で絞らない。マージ前の hook が「チェックが 1 件以上あり、すべて pass」を
  # 要求するので、CI が走らない PR はマージできなくなる（#520）。
  pull_request:
  push: { branches: [main] }
  workflow_call: {}

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # concurrency は job 側に置く。workflow レベルに置くと workflow_call 経由の
    # 呼び出しでも評価され、release の group を掴んだまま待っている呼び出し元と
    # 同じ group を要求して deadlock する。group 名に ${{ github.workflow }} を
    # 使わないのも同じ理由で、called workflow では呼び出し元の workflow 名
    # （Release）へ解決され、group 名は大文字小文字を区別しない。
    concurrency:
      group: ci-quality-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # composition のテストは、テーマのフォントに偽のバイト列を使うので、文字はシステムのフォントで描かれる。
      # ランナーには日本語のフォントが無く、フックと字幕の日本語が描かれないので、Noto CJK を入れる。
      # apt-get update が毎回 10 秒ほどかかるので、パッケージが置くファイル（フォントと fontconfig の設定）を cache する。
      # ヒットしたときは apt と同じ場所へ戻すので、テストが見るフォントは apt で入れたときと変わらない。
      # パッケージを入れ直したいときは key の版を上げる。
      - name: Cache CJK fonts
        id: cjk-fonts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/nyaucast/fonts-noto-cjk
          key: fonts-noto-cjk-${{ runner.os }}-noble-v1
      - name: Install CJK fonts
        env:
          CACHE_HIT: ${{ steps.cjk-fonts.outputs.cache-hit }}
        run: |
          cache="$HOME/.cache/nyaucast/fonts-noto-cjk"
          if [ "$CACHE_HIT" = "true" ]; then
            while IFS= read -r file; do
              sudo install -D -m 644 "$cache/files$file" "$file"
            done < "$cache/paths"
          else
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends fonts-noto-cjk
            mkdir -p "$cache/files"
            dpkg -L fonts-noto-cjk | grep -v '^/usr/share/doc/' | while IFS= read -r file; do
              if [ -f "$file" ]; then echo "$file"; fi
            done > "$cache/paths"
            xargs -d '\n' cp -L --parents -t "$cache/files" < "$cache/paths"
          fi
          sudo fc-cache -f
          fc-list :lang=ja family | grep -q "Noto Sans CJK JP"
      # render と preview のテストは、本物の chrome-headless-shell を使う。ランナーに入っている Chrome は使わず、
      # src/lib/chrome-pin.ts が pin した版を鍵に cache して、ダウンロードを省く。
      - name: Read the pinned Chrome version
        id: chrome-pin
        run: |
          build_id="$(sed -n 's/^export const chromeHeadlessShellBuildId = "\([0-9.]*\)";$/\1/p' src/lib/chrome-pin.ts)"
          test -n "$build_id"
          echo "build-id=$build_id" >> "$GITHUB_OUTPUT"
      - name: Cache Chrome
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/nyaucast/chrome
          key: chrome-headless-shell-${{ runner.os }}-${{ steps.chrome-pin.outputs.build-id }}
      # Vitest は前回の所要時間を見て遅いファイルから始めるが、CI は毎回まっさらでその情報が無い。
      # 最も遅いファイルが後から始まって全体が延びるので、所要時間の記録だけを持ち越す。実行順以外には効かない。
      - name: Cache Vitest durations
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/vitest
          key: vitest-results-${{ runner.os }}-${{ github.sha }}
          restore-keys: vitest-results-${{ runner.os }}-
      # ゲート集合の定義は package.json の check script にのみ置く。ここで step へ
      # 割り戻すと列挙が複製され、CI とローカルが食い違う経路が再び開く。
      - name: Check
        run: pnpm run check
