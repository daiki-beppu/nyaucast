name: CI

on:
  pull_request: {}
  push: { branches: [main] }
  workflow_call: {}

jobs:
  quality:
    runs-on: ubuntu-24.04
    # cache は magic-nix-cache の GitHub Actions cache バックエンドを使う
    # （FlakeHub cache は未契約・未使用）。
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          # upstream Nix を使う。Determinate Nix だと determinate-nixd が
          # FlakeHub ログインを試みて毎 run 失敗警告を出す（FlakeHub 未契約）。
          determinate: false
      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      - name: Install dependencies with frozen-lockfile
        run: nix develop --command bun install --frozen-lockfile
      # ゲート集合の定義は package.json の check script にのみ置く。ここで step へ
      # 割り戻すと列挙が複製され、CI とローカルが食い違う経路が再び開く。
      - name: Check
        run: nix develop --command bun run check
