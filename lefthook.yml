# 2 段構え: pre-commit は整形だけ、検査は pre-push が見る（check + workflow-doctor）。
#
# 整形はリポジトリ全体を対象にする（script 側が `.` を持つ）。glob は「その種類の
# ファイルが staged のときだけ走らせる」トリガとしてのみ使い、対象範囲は絞らない。
# oxfmt は冪等なので、範囲を広げても壊れるものが無い。
#
# lint はここに置かない。`oxlint --fix .` は修正しきれないエラーが**どこかに**残れば
# 非 0 で終わるため、commit と無関係なファイルのエラーで commit 自体が止まる。
# lint を含む全ゲートは pre-push の check が見るので、commit 時に持つ必要がない。
pre-commit:
  commands:
    format-fix:
      glob: "*.{js,jsx,ts,tsx,json,jsonc,md,yml,yaml}"
      run: bun run format:fix
      stage_fixed: true

# push 前に CI のゲート（check）とローカル専用の workflow-doctor を通す。
# ゲート集合は package.json の check script が持つ。
#
# workflow-doctor が check の外にある理由（takt は CI 環境に無い / flake に pin しない）と
# glob を付けない理由（定義が無変更でも takt 側の更新で壊れる）は ADR-0008 を参照。
# doctor は毎 push で回せるほど速い。
pre-push:
  commands:
    check:
      run: bun run check
    workflow-doctor:
      run: takt workflow doctor
