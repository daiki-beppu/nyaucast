# hook は呼び出し元シェルの環境を継承するため、devShell 供給ツールを rc で自給する
# （shim が lefthook 解決より前に source する。詳細は .lefthookrc / #334）。
rc: .lefthookrc

# 2 段構え: pre-commit は整形だけ、検査は pre-push の check が見る。
#
# 整形対象は commit に含める staged files に限定する。冪等性は整形結果の性質であり、
# commit 対象外の未 staged 差分まで書き換えてよい根拠にはならない。
#
# lint はここに置かない。`oxlint --fix .` は修正しきれないエラーが**どこかに**残れば
# 非 0 で終わるため、commit と無関係なファイルのエラーで commit 自体が止まる。
# lint を含む全ゲートは pre-push の check が見るので、commit 時に持つ必要がない。
pre-commit:
  commands:
    format-fix:
      glob: "*.{js,jsx,ts,tsx,json,jsonc,md,yml,yaml}"
      run: bun run --no-install oxfmt --write -- {staged_files}
      stage_fixed: true
    format-nix-fix:
      glob: "*.nix"
      run: nixfmt -- {staged_files}
      stage_fixed: true

# push 前に CI のゲート（check）を通す。
# ゲート集合は package.json の check script が持つ。
pre-push:
  commands:
    check:
      run: bun run check
