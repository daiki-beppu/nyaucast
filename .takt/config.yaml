# tayk リポジトリの takt 設定
# provider / model / language はグローバル設定 (~/.takt/config.yaml) を継承する。
#
# 実装 workflow は tayk 専用の .takt/workflows/ を使う (ADR-0008):
#   tayk-feature  — 新機能・機能拡張（intake → scenario 付き計画 → テスト設計 → 設計レビュー →
#                   test-first → 実装 → peer-review / adjudication / remediation / final-gate → spillover）
#   tayk-fix      — バグ修正・回帰修正（intake → 診断 → 診断レビュー → 再現テスト →
#                   原因修正 → peer-review / adjudication / remediation / final-gate → spillover）
#   tayk-intake   — feature / fix 共通の intake（wayfinder map / ticket 対応）
# 一般の計画・test-first・実装・レビュー・修正 prompt は takt から eject した
# .takt/steps/ を使い、tayk 固有の gate / policy / knowledge だけを重ねる。
# PR review は project workflow を持たず、takt-review skill から builtin
# review-takt-default を使う。
# commit / push / PR 作成は workflow 完了後に takt の auto_pr が行う（ADR-0008「Git と PR」）。
# タスク投入時は auto_pr: true を設定すること。
# facets は .takt/facets/、step fragment は .takt/steps/、structured output schema は .takt/schemas/。
# 定義を変えたら `takt workflow doctor <name>` で検証する。
draft_pr: false
base_branch: main

provider: codex

# tayk 専用 workflow が使う persona のルーティング。coder / 既存 reviewer 系は
# グローバル (~/.takt/config.yaml) の provider_routing.personas が解決する。
# ここに置くのは、グローバルに登録がなく既定モデルへフォールバックしてしまう persona。
provider_routing:
  personas:
    # intake の判定が全工程の入口。誤って着手を通すと後段すべてが無駄になるため最上位モデル
    tayk-intake-analyst:
      provider: codex
      model: gpt-5.6-sol
    # 設計ゲートの一角（ADR-0008「feature の工程」）。テスト設計の誤りは write_tests で red を
    # 確認しても表面化せず、「通るだけで要件を検証しないテスト」として実装後まで残る。
    # グローバルに登録がないため既定モデルへ落ちていた。planner と同格に置く
    test-planner:
      provider: codex
      model: gpt-5.6-sol
    # 診断ゲートの一角（ADR-0008「fix の工程」）。誤った原因のまま進むと、テストも修正も
    # すべて無駄になる。再現テストの red は「症状を再現できたか」しか見ないため、
    # 「症状は再現するが因果の理解が違う」誤診はここでしか捕まらない。intake と同格に置く
    tayk-diagnosis-reviewer:
      provider: codex
      model: gpt-5.6-sol
    # ADR 本文と差分の照合。他 reviewer と同格
    tayk-adr-conformance-reviewer:
      provider: codex
      model: gpt-5.6-terra
    # spillover の gh 操作（起票・重複照合）が主。手続き的な作業なので軽量モデル
    tayk-delivery-operator:
      provider: codex
      model: gpt-5.6-luna

# 失敗タスクの自動再投入を無効化する（グローバル ~/.takt/config.yaml の 2 回を上書き）。
# 0 は takt 側で reason: 'disabled' として扱われ、再投入は一切試みられない。
# 経緯: #169 で 2 回 → 1 回に絞った（2026-07 のキュー実測で 2 回目に救えた失敗は 0 件
# — BLOCKED / 判断待ち系は同じ状態を再評価して同じ結論に落ちる #77 / #105 / #118 / #141）。
# 残していた 1 回も止め、失敗タスクは必ず人が状態を見てから再投入する運用にする。
auto_requeue_max_attempts: 0

# トークン消費の計測。記録先: .takt/runs/<run>/logs/<session>-usage-events.phase.jsonl
# tayk-feature は default より step が多いため、費用が見合うかをここで観測する（ADR-0008 Consequences）
observability:
  enabled: true
  usage_events_phase: true
