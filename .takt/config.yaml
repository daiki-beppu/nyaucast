# tayk リポジトリの takt 設定
# provider / model / language はグローバル設定 (~/.takt/config.yaml) を継承する。
# workflow は本リポジトリ専用の feature / fix を標準入口として使う。
# 共通の intake・レビュー・delivery 契約は shared callable workflow を介して再利用する。
draft_pr: false
auto_pr: false
# `takt run`/`takt watch` retries failed queued tasks; PR review monitoring is
# resumed with `takt --pr <N>` so the workflow receives current-pr explicitly.
auto_requeue_max_attempts: 3
base_branch: main
workflow_command_gates:
  custom_scripts: true

provider: codex
persona_providers:
  coder:
    provider: codex
  planner:
    provider: codex

# トークン消費の計測。記録先: .takt/runs/<run>/logs/<session>-usage-events.phase.jsonl
observability:
  enabled: true
  usage_events_phase: true
