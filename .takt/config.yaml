# nyacast リポジトリの takt 設定
# language はグローバル設定 (~/.takt/config.yaml)、provider / model の割り当てと companion は
# グローバルの ~/.takt/runtime.yaml を継承する。ここに provider 系のキー（provider / model /
# provider_routing / persona_providers）を書くと runtime.yaml と混在して
# "Mixed provider configuration" で agent 実行前に止まる。
#
# 実装は builtin workflow を直用し、nyacast 固有の workflow 資産は持たない（ADR-0008）。
# workflow の使い分けは docs/agents/issue-tracker.md を参照。
draft_pr: false
base_branch: main

# 失敗タスクの自動再投入を無効化する（グローバル ~/.takt/config.yaml の 2 回を上書き）。
# 0 は takt 側で reason: 'disabled' として扱われ、再投入は一切試みられない。
# 経緯: #169 で 2 回 → 1 回に絞った（2026-07 のキュー実測で 2 回目に救えた失敗は 0 件
# — BLOCKED / 判断待ち系は同じ状態を再評価して同じ結論に落ちる #77 / #105 / #118 / #141）。
# 残していた 1 回も止め、失敗タスクは必ず人が状態を見てから再投入する運用にする。
auto_requeue_max_attempts: 0

# トークン消費の計測。記録先: .takt/runs/<run>/logs/<session>-usage-events.phase.jsonl
observability:
  enabled: true
  usage_events_phase: true
