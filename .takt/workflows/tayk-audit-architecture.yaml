# アーキテクチャ / 構成の全件監査 workflow（#108）。builtin audit-architecture の fork。
#
# fork した理由（builtin のままでは完走できなかった 2 点。run 20260728-042609 の abort 記録）:
#
# 1. メタレビュー上書きの悪循環 — builtin の output contract は「REJECT → ブロッキング
#    指摘と影響モジュールのみ」を許すため、review が監査の続きではなく「監査レポートへの
#    レビュー」を書いて 02 レポートを上書きし、蓄積した監査カバレッジを破壊していた。
#    tayk 版の output contract（tayk-architecture-audit）は Audit Scope 表を計画の
#    Audit Targets と一対一・全行維持（未着手は ⏳）とし、Result にかかわらず削る
#    ことを禁じる。単調増加を契約にすることでループが必ず前進する
# 2. 容量不足 — builtin は max_steps 12 固定だが、plan が生成する監査対象数と連動しない。
#    tayk 版は plan 側に対象数上限（28。tayk-architecture-audit-plan 参照）を置き、
#    review 側に 1 サイクル最低 4 対象の前進義務を置いて、max_steps 24 と整合させる。
#    plan(1) + audit(1) + [supervise+review] ×10 + publish(1) = 23 ≤ 24
#
# ループ上限の実効性（ADR-0008「有限停止」）:
#   cycle [supervise, review] への遷移は audit → supervise（初回のみ）、review → supervise、
#   supervise → review、loop judge → review / publish の 4 本だけ。cycle の外から再入される
#   step は無いので、loop monitor だけで上限が保証され、{step_iteration} の自前上限は不要。
#   publish / ABORT は cycle から出る一方向。遷移を足すときはこの前提を崩さないこと
name: tayk-audit-architecture
description: >
  アーキテクチャ / 構成の全件監査。order.md でスコープを与え、計画 → 分担監査 →
  監督 ⇄ 再監査で全対象を監査し、Issue 直貼り可能なレポートを docs/audits/ へ
  配置する。publish 以外の全 step は read-only でコードを変更しない。
max_steps: 24
initial_step: plan

loop_monitors:
  - cycle:
      - supervise
      - review
    threshold: 3
    judge:
      persona: supervisor
      instruction: tayk-loop-monitor-audit
      rules:
        - condition: 監査が完了している（全対象が監査済みで Issue 直貼り品質）
          next: publish
        - condition: 健全（監査済み対象が増え続けており、残りを回収できる見込み）
          next: review
        - condition: 非生産的（監査済みが増えていない、または残り iteration で回収不能）
          next: ABORT

steps:
  - name: plan
    description: スコープ内のモジュールを棚卸しし、番号を固定した監査対象表（Audit Targets）を作る
    tags:
      - review
    edit: false
    persona: planner
    knowledge: architecture
    capabilities: readonly
    instruction: tayk-architecture-audit-plan
    output_contracts:
      report:
        - name: 01-architecture-audit-plan.md
          format: tayk-architecture-audit-plan
    rules:
      - condition: モジュール棚卸しと監査対象表の作成が完了
        next: audit
      - condition: スコープが不明確で監査対象を確定できない
        next: ABORT

  - name: audit
    description: 監査対象を 3 パートに分担して並列監査し、全対象の一対一表を初回で作り切る
    tags:
      - review
    edit: false
    persona: architecture-reviewer
    policy: review
    knowledge: architecture
    instruction: tayk-architecture-audit-team-leader
    team_leader:
      max_parts: 3
      part_persona: architecture-reviewer
      part_edit: false
    output_contracts:
      report:
        - name: 02-architecture-audit.md
          format: tayk-architecture-audit
    rules:
      - condition: 監査完了
        next: supervise

  - name: supervise
    description: 一対一表の照合と品質判定。判定のみでレポートは書かない
    tags:
      - review
    edit: false
    persona: supervisor
    policy: review
    knowledge: architecture
    capabilities: readonly
    instruction: tayk-architecture-audit-supervise
    pass_previous_response: false
    structured_output:
      schema_ref: tayk-audit-supervise
    # 合否は supervisor の申告値による決定的ルーティング（CLAUDE.md の rule 構文規約）。
    # 素の文字列 condition に落とすと LLM 判定に化けるので必ず when() で包む
    rules:
      - condition: when(structured.supervise.verdict == "approve")
        next: publish
      - condition: when(structured.supervise.verdict == "rework")
        next: review
      - condition: when(structured.supervise.verdict == "table_broken")
        next: review
      - condition: when(true)
        next: ABORT

  - name: review
    description: 未監査（⏳）と根拠不足の対象を再監査し、一対一表を前進させる
    tags:
      - review
    edit: false
    persona: architecture-reviewer
    policy: review
    knowledge: architecture
    capabilities: readonly
    instruction: tayk-architecture-audit-review
    output_contracts:
      report:
        - name: 02-architecture-audit.md
          format: tayk-architecture-audit
    rules:
      - condition: when(true)
        next: supervise

  - name: publish
    description: 完成した監査レポートを docs/audits/ へ配置する（この workflow 唯一の書き込み step）
    tags:
      - delivery
    edit: true
    persona: tayk-delivery-operator
    required_permission_mode: edit
    capabilities: edit
    instruction: tayk-architecture-audit-publish
    pass_previous_response: false
    quality_gates:
      - レポート本文を書き換えていないこと（冒頭への出典追記のみ）
      - docs/audits/ 以外のファイルを変更していないこと
    rules:
      - condition: 配置完了
        next: COMPLETE
      - condition: レポートが見つからない、または配置できない
        next: ABORT
