name: tayk-impl-review
description: >
  tayk 共通の実装レビューフェーズ。アーキテクチャ / AI アンチパターン / コーディング /
  ADR 整合性の 4 並列レビュー ⇄ 修正のループを内側に閉じて持つ。feature / fix の
  両 workflow から呼ばれる。
subworkflow:
  callable: true
  visibility: internal
  returns:
    # 指摘が計画・要件（fix では原因の特定・修正方針）の側に帰着し、
    # このループの中では解けないことを呼び出し元へ返す
    - need_replan
workflow_config:
  provider_options:
    codex:
      network_access: true
    opencode:
      network_access: true
# Finding Contract（takt 内蔵の finding ledger。#170）。レビュー finding は raw 観測
# として台帳へ集約され、同一性追跡（ID 振り直しの無効化）・レビュア間矛盾の調停
# （finding-conflict-adjudication）・ラウンド予算を engine が持つ。決定 6 の 2 分類は
# 維持する — ブロッキング指摘だけを structured issue（台帳）に載せ、非ブロッキング
# 指摘は各レポートの専用節に残して spillover が読む（tayk-*-finding-contract 契約）。
# FC は workflow 単位で全レビュアに適用されるため、この sub-workflow に閉じて導入
# する（親に置くと FC 契約を持たない design / diagnose レビュアまで FC モードに落ちる）
finding_contract:
  ledger_path: .takt/findings/tayk-impl-review.json
  raw_findings_path: .takt/findings/tayk-impl-review/raw
  manager:
    persona: findings-manager
    instruction: findings-manager
    output_contract: findings-manager
# レビュー 4 並列 ⇄ 修正を最大 3 周する。ループの歯止めは loop monitor が持ち、
# max_steps はそれをすり抜けた場合の最後の保険
max_steps: 30
initial_step: impl_review
loop_monitors:
  # ── 実装レビュー ⇄ 修正。FC 版の builtin 判断基準（findings ledger を読む）を使う ──
  #
  # このループを sub-workflow の内側に閉じてあるのが要点である。takt の cycle 判定は
  # 「履歴末尾でパターンが *連続して* threshold 回反復する」厳密一致であり、cycle の外から
  # 再入されると途中に別 step が挟まってカウントが 1 に戻る。fix を親 workflow に置くと
  # final_gate / delivery の needs_fix が fix へ直接飛び込むため、この経路で上限 3 が
  # 失われていた。呼び出し元は fix ではなくこの sub-workflow を再呼び出しするため、
  # 内側では [impl_review, fix] が必ず連続し、monitor だけで上限が保証される
  # （ADR-0008 決定 12・Consequences）
  - cycle:
      - impl_review
      - fix
    threshold: 3
    judge:
      persona: supervisor
      instruction: loop-monitor-reviewers-fix-fc
      rules:
        - condition: 修正後レビューで進捗が確認され、次の修正が実行可能である
          next: impl_review
        # loop monitor の rule は next しか取れない（takt の LoopMonitorRuleSchema）。
        # 呼び出し元へ差し戻すために、返すためだけの system step を経由する
        - condition: 同じ指摘が繰り返されるが再計画（fix では再診断）で解消できる見込みがある
          next: bail_replan
        - condition: 試行済みの再計画を踏まえても要件を満たす実現可能な方針がない
          next: ABORT
steps:
  - name: impl_review
    description: アーキテクチャ / AI アンチパターン / コーディング / ADR 整合性の 4 並列レビュー
    tags:
      - review
    parallel:
      - name: arch-review
        tags:
          - review
        edit: false
        persona: architecture-reviewer
        policy:
          - review
          - existing-system-respect
          - tayk-review-convergence
        knowledge:
          - architecture
          - tayk-domain
        provider_options:
          extends: review-readonly
        instruction: review-arch
        rules:
          - condition: approved
          - condition: needs_fix
        output_contracts:
          report:
            - name: architect-review.md
              format: tayk-architecture-review-finding-contract
      - name: ai-antipattern-review-2nd
        tags:
          - review
        edit: false
        persona: ai-antipattern-reviewer
        policy:
          - review
          - ai-antipattern
          - existing-system-respect
          - tayk-review-convergence
        provider_options:
          extends: review-readonly
        instruction: ai-antipattern-review
        rules:
          - condition: AI特有の問題なし
          - condition: AI特有の問題あり
        output_contracts:
          report:
            - name: ai-antipattern-review.md
              format: tayk-ai-antipattern-review-finding-contract
      - name: coding-review
        tags:
          - review
        edit: false
        persona: coding-reviewer
        policy:
          - review
          - coding
          - tayk-traceability
          - existing-system-respect
          - tayk-review-convergence
        pass_previous_response: false
        provider_options:
          extends: review-readonly
        instruction: review-coding
        rules:
          - condition: approved
          - condition: needs_fix
        output_contracts:
          report:
            - name: coding-review.md
              format: tayk-coding-review-finding-contract
      - name: adr-conformance-impl
        tags:
          - review
          - adr
        edit: false
        persona: tayk-adr-conformance-reviewer
        policy:
          - review
          - tayk-review-rescan
          - tayk-review-convergence
        knowledge:
          - tayk-adr
          - tayk-domain
        pass_previous_response: false
        provider_options:
          extends: review-readonly
        instruction: tayk-review-adr-conformance-impl
        rules:
          - condition: APPROVE
          - condition: REJECT
          - condition: NEEDS_ADR_REVISION
        output_contracts:
          report:
            - name: adr-conformance-impl.md
              format: tayk-adr-conformance-review-finding-contract
    rules:
      # ── Finding Contract の決定的ルーティング（#170）。findings.* は engine が管理
      # する台帳の状態で、rule は builtin 参照実装（review-fix-takt-default-high）に
      # 合わせてある。finding-conflict-adjudication は engine 合成 step ──
      #
      # レビュア間で矛盾する finding は、修正へ渡す前に調停する
      - condition: when(findings.conflicts.count > 0 && findings.conflicts.unadjudicated.count > 0)
        next: finding-conflict-adjudication
      # 調停を経ても残る矛盾は機械では解けない
      - condition: when(findings.conflicts.count > 0)
        next: ABORT
      # findings-manager の invalid / 欠落判断（provisional）は、fixpoint 到達・予算
      # 枯渇を含めて再計画へ返す（COMPLETE の rule より前に明示 route を置く規約）。
      # boundedness は親側の plan / diagnose の自前上限（4 回目で ABORT。ADR-0008
      # 決定 6）と親の loop monitor が持つため、局所の replan monitor は置かず、
      # doctor が callable 用に認める rule 直接の `return: need_replan` で親へ返す
      - condition: when(findings.provisional.fixpoint == true && findings.conflicts.count == 0)
        return: need_replan
      - condition: when(findings.rounds.budgetExhausted == true && findings.provisional.count > 0 && findings.conflicts.count == 0)
        return: need_replan
      - condition: when(findings.provisional.count > 0 && findings.conflicts.count == 0)
        return: need_replan
      # reviewer anomaly（引用不成立・stale snapshot）は隔離された claim の再取得が
      # 要る。COMPLETE で素通りさせず再レビューで観測し直し、anomaly 予算の枯渇時は
      # 再計画へ返す。doctor はこの 2 rule を「COMPLETE の直前 2 つ・guard 節は
      # COMPLETE の when 節 + anomaly 節の完全一致・aggregate 付き」の形で検査する
      - condition: any("approved", "AI特有の問題なし", "APPROVE") && when(findings.open.count == 0 && findings.provisional.count == 0 && findings.conflicts.count == 0 && findings.reviewerAnomalies.count > 0 && findings.reviewerAnomalies.budgetExhausted == true)
        return: need_replan
      - condition: any("approved", "AI特有の問題なし", "APPROVE") && when(findings.open.count == 0 && findings.provisional.count == 0 && findings.conflicts.count == 0 && findings.reviewerAnomalies.count > 0)
        next: impl_review
      # all() の複数引数は並列 sub-step と位置対応で照合され、個数が一致しないと
      # ルールごとスキップされる（= COMPLETE 不能）。sub-step の宣言順に 4 個並べる
      - condition: all("approved", "AI特有の問題なし", "approved", "APPROVE") && when(findings.open.count == 0 && findings.provisional.count == 0 && findings.conflicts.count == 0)
        next: COMPLETE
      - condition: any("needs_fix", "AI特有の問題あり", "REJECT", "NEEDS_ADR_REVISION") && when(findings.conflicts.count == 0)
        next: fix
      - condition: when(findings.conflicts.count == 0 && findings.open.count > 0)
        next: fix
      # sub-step の verdict がどの宣言条件にも分類されないと（分類器の失敗・空応答）、
      # all() は false・any() は skip になり上の rule が外れ、rule 不一致で run 全体が
      # ABORT していた（#167。全レビュー APPROVE でも落ちる）。決定的な受け皿で
      # 再レビューへ戻す。連続自己再入は fix への外部再入ではないため ADR-0008
      # 決定 12 に反しない。上限は max_steps が持つ
      - condition: when(true)
        next: impl_review

  - name: fix
    description: 実装レビュー指摘の修正
    tags:
      - coding
    edit: true
    persona: coder
    policy:
      - coding
      - testing
      - tayk-traceability
      - existing-system-respect
      - tayk-scope-spillover
      - tayk-conflict-escalation
    knowledge:
      - architecture
      - tayk-adr
    required_permission_mode: edit
    session: refresh
    provider_options:
      extends: edit
    promotion:
      - at: 2
        provider_options:
          codex:
            reasoning_effort: high
          claude:
            effort: high
    instruction: fix
    pass_previous_response: false
    # FC では findings-manager が fix レポートから fixCoverage を読む。
    # builtin 参照実装と同じ report 契約を明示する（use_judge: false も同様）
    output_contracts:
      report:
        - name: fix-report.md
          format: fix-report
          use_judge: false
    quality_gates:
      - テストの削除・skip・アサーション緩和で指摘を消していないこと
      - 先行して書いたテスト（feature ではテスト先行、fix では再現テスト）が green のままであること
      - ADR 逸脱の指摘に対し、該当 ADR の改訂を差分に含めたか、逸脱を解消したかのいずれかであること
      - 計画（fix では診断）の要件 ID にない機能を追加していないこと
    rules:
      # 上限は loop monitor が持つ。この step は「このループでは解けない」と分かった
      # ときだけ呼び出し元へ返す
      - condition: 修正完了
        next: impl_review
      - condition: 判断できない、情報不足
        return: need_replan

  # loop monitor の judge が「再計画で打開できる」と判定したときの返却口。
  # agent を起動しない system step なのでコストはゼロ
  - name: bail_replan
    mode: system
    rules:
      - condition: when(true)
        return: need_replan
