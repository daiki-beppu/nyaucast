name: tayk-delivery
description: >
  tayk 共通の delivery フェーズ。commit → push → PR 作成 → CI 監視 →
  自動レビュー指摘の解消まで。feature / fix の両 workflow から呼ばれる。
subworkflow:
  callable: true
  visibility: internal
  returns:
    # 実装側でしか直せない失敗（テスト設計の誤り・方針の食い違い）を呼び出し元へ返す
    - needs_fix
workflow_config:
  provider_options:
    codex:
      network_access: true
    opencode:
      network_access: true
# CI 待ちで ci_check を最大 12 周し、そのあとレビュー待ちが続くため default (30) では足りない。
# ループの歯止めは loop monitor と ci_fix / review_fix のラウンド上限が持つ。
# max_steps はそれらをすり抜けた場合の最後の保険であり、正常系が枯渇しない広さを取る
max_steps: 120
initial_step: pr_open
loop_monitors:
  # cycle は 2 要素以上必要で、末尾 step が一致したときだけ照合される。
  # 各 monitor の末尾を ci_check / ci_wait / review_triage / review_fix に分けてあるため、
  # 4 つの monitor は互いに干渉しない。
  #
  # 重要: 照合は「履歴末尾でパターンが *連続して* threshold 回反復する」厳密一致である。
  # 待機の再試行（ci_check の pending / review_triage の awaiting）がループの途中に挟まると
  # カウントは 1 に戻る。したがって ② ④ のような多要素 cycle だけでは上限 3 を保証できない。
  # 実効的な上限は ci_fix / review_fix 自身が {step_iteration} で持つ（ADR-0008 Consequences）。
  #
  # ① CI の完了待ちが終わらない。正常系でも数周するため threshold は大きめ。
  - cycle:
      - ci_wait
      - ci_check
    threshold: 12
    judge:
      persona: supervisor
      instruction: tayk-loop-monitor-ci-wait
      rules:
        - condition: CI は進行中（待機を継続してよい）
          next: ci_wait
        - condition: 詰まっている（承認待ち・runner 枯渇・トリガ不一致・権限）
          next: ABORT
  # ② CI の失敗を直しては落ちる往復。
  - cycle:
      - ci_check
      - ci_fix
      - ci_wait
    threshold: 3
    judge:
      persona: supervisor
      instruction: tayk-loop-monitor-ci-fix
      rules:
        - condition: 健全（失敗が減っている・原因が特定されている）
          next: ci_wait
        - condition: 実装またはテスト設計の誤りが原因
          next: ABORT
        - condition: 環境要因で解決しない
          next: ABORT
  # ③ レビューの結論待ちが終わらない（review_triage が awaiting を返し続ける）。
  #    この時点では review_fix が一度も走っていないことがあるため、④ と同じ
  #    「修正が指摘に届いているか」ではなく「レビューが返ってくるか」を判定させる。
  - cycle:
      - review_wait
      - review_triage
    threshold: 8
    judge:
      persona: supervisor
      instruction: tayk-loop-monitor-review-wait
      rules:
        - condition: レビューは進行中（待機を継続してよい）
          next: review_wait
        - condition: レビューが返らない、または残るのが nit のみで実質収束している
          next: finalize
        - condition: レビュー基盤の問題（bot 未起動・権限・トリガ不一致）で結論が得られない
          next: ABORT
  # ④ レビュー指摘の解消が一周しても収束しない。
  #    awaiting の挟み込みでカウントが崩れうるため、これ単独を上限とみなさないこと。
  - cycle:
      - ci_wait
      - ci_check
      - review_wait
      - review_triage
      - review_fix
    threshold: 3
    judge:
      persona: supervisor
      instruction: tayk-loop-monitor-review
      rules:
        - condition: 健全（未解決の指摘が減っている）
          next: ci_wait
        - condition: 実質的に収束している（nit のみ残存）
          next: finalize
        - condition: 方針の食い違い / ADR との衝突で決着しない
          next: ABORT
steps:
  - name: pr_open
    description: commit → push → PR 作成（既存 PR があれば更新）
    tags:
      - delivery
    edit: true
    persona: tayk-delivery-operator
    # TAKT は通常ワークフロー成功後にまとめて stage/commit するため、
    # 各 step の git commit を禁じている。delivery は PR を自分で立てる必要があるので
    # この step だけ解禁する（trust boundary の明示的な引き上げ）。
    allow_git_commit: true
    required_permission_mode: edit
    provider_options:
      extends: edit
    instruction: tayk-pr-open
    quality_gates:
      - commit メッセージが日本語 Conventional Commits で、タイトル末尾に linked issue の (#N) を持つこと
      - PR 本文に Closes #N と要件 ID ごとの充足状況が含まれること
      # 要件 ID の出所はテストコード（親の plan.md / diagnosis.md は callable の内側からは
      # 見えない）。スコープ外発見の起票結果は後段の spillover が PR 本文へ追記する
      - 要件 ID をテストコードから取得しており、親の Report Directory を参照していないこと
      - main へ直接 push していないこと
      - .takt/runs/ 配下の実行時生成物を commit に含めていないこと
    rules:
      - condition: PR の作成または更新が完了した
        next: ci_wait
      - condition: push が拒否された、または PR を作成できない
        next: ABORT

  # 待機だけを行う system step。CI 起動前に問い合わせても pending が返るだけなので、
  # 先に待ってから確認する。agent を起動しないので待機コストはゼロ。
  - name: ci_wait
    mode: system
    delay_before_ms: 90000
    rules:
      - when: "true"
        next: ci_check

  - name: ci_check
    description: CI の実行状況を確認し、状態を構造化出力で返す
    tags:
      - delivery
      - ci
    edit: false
    persona: tayk-delivery-operator
    # 毎回まっさらな状態で状況を取り直す（前回の pending 判断を引きずらせない）
    session: refresh
    provider_options:
      extends: review-readonly
    instruction: tayk-ci-check
    structured_output:
      schema_ref: tayk-ci-status
    rules:
      - when: structured.ci_check.status == "pending"
        next: ci_wait
      - when: structured.ci_check.status == "success"
        next: review_wait
      - when: structured.ci_check.status == "failure"
        next: ci_fix
      - when: structured.ci_check.status == "unavailable"
        next: review_wait
      - when: "true"
        next: ABORT

  - name: ci_fix
    description: CI 失敗の原因を特定して修正し、push する
    tags:
      - delivery
      - coding
    edit: true
    persona: coder
    policy:
      - coding
      - testing
      - tayk-toolchain
    knowledge:
      - tayk-adr
    allow_git_commit: true
    required_permission_mode: edit
    session: refresh
    provider_options:
      extends: edit
    # 1 回目の修正で直らなかった失敗は、原因が浅くない。2 周目から推論を厚くする。
    promotion:
      - at: 2
        provider_options:
          codex:
            reasoning_effort: high
          claude:
            effort: high
    instruction: tayk-ci-fix
    pass_previous_response: false
    quality_gates:
      - テストの削除・skip・アサーション緩和・lint 無効化で CI を通していないこと
      - 修正前にローカルで CI と同じコマンドを実行し、再現と解消を確認していること
      - 原因を特定したうえで修正していること（症状への場当たり修正でないこと）
    rules:
      # loop monitor ② は ci_check の pending 挟み込みでカウントが崩れるため、
      # ラウンド上限をこの step 自身にも持たせる（ADR-0008 決定 6）
      - condition: これが 4 回目以降の CI 修正である（3 ラウンドで CI が緑にならなかった）
        return: needs_fix
      - condition: 原因を特定して修正し push した
        next: ci_wait
      - condition: flaky と判断した（同一コミットで結果が揺れた根拠あり）
        next: ci_wait
      - condition: 実装またはテスト設計の誤りが原因でこの step では直せない
        return: needs_fix

  # 自動レビュー（CodeRabbit 等）が走り終わるのを待ってから収集する
  - name: review_wait
    mode: system
    delay_before_ms: 60000
    rules:
      - when: "true"
        next: review_triage

  - name: review_triage
    description: レビュー指摘を収集し、対応する / 対応しないに分類する
    tags:
      - delivery
      - review
    edit: false
    persona: tayk-delivery-operator
    policy: review
    session: refresh
    provider_options:
      extends: review-readonly
    instruction: tayk-review-triage
    structured_output:
      schema_ref: tayk-review-triage
    rules:
      - when: structured.review_triage.status == "actionable"
        next: review_fix
      - when: structured.review_triage.status == "awaiting"
        next: review_wait
      - when: structured.review_triage.status == "clean"
        next: finalize
      - when: "true"
        next: ABORT

  - name: review_fix
    description: レビュー指摘を修正して push する
    tags:
      - delivery
      - coding
    edit: true
    persona: coder
    policy:
      - coding
      - testing
      - tayk-toolchain
    knowledge:
      - tayk-adr
      - tayk-domain
    allow_git_commit: true
    required_permission_mode: edit
    session: refresh
    provider_options:
      extends: edit
    promotion:
      - at: 2
        provider_options:
          codex:
            reasoning_effort: high
          claude:
            effort: high
    instruction: tayk-review-fix
    pass_previous_response: false
    quality_gates:
      - 指摘された箇所そのものを直しており、周辺の「ついで直し」を含んでいないこと
      - ADR に反する修正を、レビュー指摘を理由に行っていないこと
      - 修正後に影響範囲のテストをローカルで実行していること
    rules:
      # loop monitor ④ は review_triage の awaiting 挟み込みでカウントが崩れるため、
      # ラウンド上限をこの step 自身にも持たせる（ADR-0008 決定 6）
      - condition: これが 4 回目以降のレビュー指摘修正である（3 ラウンドで収束しなかった）
        return: needs_fix
      - condition: 全 actionable を修正して push した
        next: ci_wait
      - condition: 指摘が実装方針そのものの誤りを突いており、この step では直せない
        return: needs_fix
      - condition: 指摘と ADR が衝突する
        return: needs_fix

  - name: finalize
    description: PR を人間のレビュー待ちとして着地させ、受け渡しの記録を残す
    tags:
      - delivery
    edit: false
    persona: tayk-delivery-operator
    # PR 本文の更新とコメント投稿を行うため Bash（gh）が要る。
    # ソースは触らないので edit: false のまま。
    provider_options:
      extends: review-readonly
    instruction: tayk-delivery-finalize
    quality_gates:
      - PR をマージしていないこと
      - CI が緑でない場合、その事実と理由を明記していること
      - 対応しなかったレビュー指摘の理由を PR に残していること
    rules:
      - condition: PR を最新化し記録を残した
        next: COMPLETE
      - condition: PR の更新に失敗した
        next: ABORT
    output_contracts:
      report:
        - name: delivery-log.md
          format: tayk-delivery-log
