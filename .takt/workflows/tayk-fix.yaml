name: tayk-fix
description: >
  tayk の不具合修正 workflow。issue intake、原因診断と独立レビュー、修正前の red 再現、
  root-cause repair、Finding Contract 付き専門レビュー、最終ゲート、spillover を行う。
  実装レビューと修正の基礎プロンプトは takt 0.55 の eject 済み step fragment を使う。
finding_contract:
  ledger_path: .takt/findings/tayk-fix.json
  raw_findings_path: .takt/findings/tayk-fix/raw
  manager:
    persona: findings-manager
    instruction: findings-manager
    output_contract: findings-manager
workflow_config:
  provider_options:
    codex:
      network_access: true
    opencode:
      network_access: true
max_steps: 50
initial_step: intake

loop_monitors:
  - cycle: [diagnose_review, diagnose_fix]
    threshold: 3
    judge:
      persona: supervisor
      instruction: tayk-loop-monitor-diagnosis
      rules:
        - condition: 健全（仮説が絞られ、診断の検証可能性が上がっている）
          next: diagnose_review
        - condition: 原因仮説を作り直す必要がある
          next: diagnose
        - condition: 利用可能な証拠では原因を一意に確定できない
          next: ABORT
  - cycle: [diagnose, diagnose_review]
    ignore_steps: [diagnose_fix, reproduce]
    threshold: 3
    judge:
      persona: supervisor
      instruction: tayk-loop-monitor-rediagnose
      rules:
        - condition: 健全（新しい反証または観測により仮説が収束している）
          next: diagnose
        - condition: 非生産的（同じ仮説と失敗を繰り返している）
          next: ABORT
  - cycle: [fix, reviewers]
    ignore_steps: [final_gate]
    threshold: 3
    judge:
      persona: supervisor
      instruction: loop-monitor-reviewers-fix-fc
      rules:
        - condition: 修正進捗があり、報告内容が収束中で、次の修正が実行可能である
          next: fix
        - condition: 修正未完了または報告未収束で、再診断により解消できる見込みがある
          next: diagnose
        - condition: 試行済みの再診断を踏まえても要件を満たす実現可能な方針がない
          next: ABORT

steps:
  - name: intake
    kind: workflow_call
    call: tayk-intake
    rules:
      - condition: COMPLETE
        next: diagnose
      - condition: blocked
        next: ABORT
      - condition: ABORT
        next: ABORT

  - name: diagnose
    description: 原因、反証可能な予測、修正方針、回帰契約を確定する
    tags: [plan, diagnosis]
    edit: false
    session: compact
    persona: planner
    policy: [existing-system-respect, tayk-traceability, tayk-toolchain]
    knowledge: [architecture, implementation-semantics, tayk-adr, tayk-domain]
    provider_options:
      extends: review-readonly
    instruction: tayk-diagnose
    output_contracts:
      report:
        - name: diagnosis.md
          format: tayk-diagnosis
    rules:
      - condition: 原因の因果連鎖、対立仮説の棄却、予測、修正方針、回帰契約を確定した
        next: diagnose_review
      - condition: 再現条件または必要な証拠を取得できない
        next: ABORT
      - condition: 原因が複数あり単一の修正 scope に収まらない
        next: ABORT

  - name: diagnose_review
    description: 診断妥当性、ADR 整合性、回帰検証設計を独立に審査する
    tags: [review, diagnosis-gate]
    parallel:
      - name: diagnosis-review
        tags: [review, diagnosis-gate]
        edit: false
        session: compact
        persona: tayk-diagnosis-reviewer
        policy:
          [
            review,
            existing-system-respect,
            tayk-review-rescan,
            tayk-review-convergence,
          ]
        knowledge: [architecture, implementation-semantics, tayk-domain]
        provider_options:
          extends: review-readonly
        instruction: tayk-review-diagnosis
        output_contracts:
          report:
            - name: diagnosis-review.md
              format: tayk-diagnosis-review
        rules:
          - condition: APPROVE
          - condition: REJECT
          - condition: NEED_REDIAGNOSE
      - name: adr-conformance-diagnosis
        tags: [review, diagnosis-gate, adr]
        edit: false
        session: compact
        persona: tayk-adr-conformance-reviewer
        policy: [review, tayk-review-rescan, tayk-review-convergence]
        knowledge: [tayk-adr, tayk-domain]
        provider_options:
          extends: review-readonly
        instruction: tayk-review-adr-conformance-gate
        output_contracts:
          report:
            - name: adr-conformance-diagnosis.md
              format: tayk-adr-conformance-review
        rules:
          - condition: APPROVE
          - condition: REJECT
          - condition: NEEDS_ADR_REVISION
      - name: regression-design-review
        tags: [review, diagnosis-gate]
        edit: false
        session: compact
        persona: testing-reviewer
        policy:
          [
            review,
            testing,
            tayk-traceability,
            tayk-review-rescan,
            tayk-review-convergence,
          ]
        knowledge: [unit-testing, e2e-testing]
        provider_options:
          extends: review-readonly
        instruction: tayk-review-test-design
        output_contracts:
          report:
            - name: regression-design-review.md
              format: tayk-test-design-review
        rules:
          - condition: APPROVE
          - condition: REJECT
    rules:
      - condition: all("APPROVE")
        next: reproduce
      - condition: any("NEED_REDIAGNOSE")
        next: diagnose
      - condition: any("REJECT", "NEEDS_ADR_REVISION")
        next: diagnose_fix
      - condition: when(true)
        next: diagnose_review

  - name: diagnose_fix
    description: 診断レビュー指摘を解消する（コードは変更しない）
    tags: [plan, diagnosis-gate]
    edit: false
    session: compact
    persona: planner
    policy:
      [existing-system-respect, tayk-traceability, tayk-conflict-escalation]
    knowledge: [architecture, implementation-semantics, tayk-adr]
    provider_options:
      extends: review-readonly
    instruction: tayk-gate-fix
    rules:
      - condition: 全 finding に対応した
        next: diagnose_review
      - condition: 指摘が原因仮説そのものを無効化した
        next: diagnose

  - name: reproduce
    description: 診断の予測を修正前の red テストで検証する
    tags: [coding, test-planning]
    edit: true
    session: compact
    persona: coder
    policy:
      [
        coding,
        testing,
        existing-system-respect,
        tayk-traceability,
        tayk-toolchain,
      ]
    knowledge:
      [
        takt,
        architecture,
        unit-testing,
        e2e-testing,
        implementation-semantics,
        tayk-adr,
      ]
    required_permission_mode: edit
    instruction: tayk-reproduce
    output_contracts:
      report:
        - name: test-report.md
          format: test-report
    rules:
      - condition: 再現テストが red で診断の予測と一致し、既存挙動の回帰テストが green である
        next: repair
      - condition: 再現テストが green、予測と異なる失敗、または既存回帰が red である
        next: diagnose
      - condition: 環境依存により決定的な再現テストを作れない
        next: diagnose_fix

  - name: repair
    description: 診断で特定した原因を除去し、red を green にする
    tags: [coding]
    edit: true
    session: compact
    persona: coder
    policy:
      [
        coding,
        testing,
        existing-system-respect,
        tayk-traceability,
        tayk-scope-spillover,
        tayk-toolchain,
      ]
    knowledge:
      [takt, architecture, implementation-semantics, tayk-adr, tayk-domain]
    required_permission_mode: edit
    instruction: tayk-repair
    output_contracts:
      report:
        - name: maintenance-scope.md
          format: maintenance-scope
    rules:
      - condition: 原因を除き、再現テストと既存回帰が green になった
        next: reviewers
      - condition: 修正が対症療法、ADR 衝突、または予測不一致になった
        next: diagnose

  - name: reviewers
    uses: reviewers
    rules:
      self:
        - condition: when(findings.conflicts.count > 0 && findings.conflicts.unadjudicated.count > 0)
          next: finding-conflict-adjudication
        - condition: when(findings.conflicts.count > 0)
          next: ABORT
        - condition: when(findings.provisional.count > 0 && findings.conflicts.count == 0)
          next: diagnose
        - condition: all("approved", "AI特有の問題なし", "approved", "approved", "approved", "approved", "APPROVE") && when(findings.open.count == 0 && findings.provisional.count == 0 && findings.conflicts.count == 0)
          next: final_gate
        - condition: any("approved", "needs_fix", "AI特有の問題なし", "AI特有の問題あり", "APPROVE", "REJECT", "NEEDS_ADR_REVISION") && when(findings.open.count == 0 && findings.provisional.count == 0 && findings.conflicts.count == 0 && findings.reviewerAnomalies.count > 0)
          next: final_gate
        - condition: any("needs_fix", "AI特有の問題あり", "REJECT", "NEEDS_ADR_REVISION") && when(findings.conflicts.count == 0)
          next: fix
        - condition: when(findings.conflicts.count == 0 && findings.open.count > 0)
          next: fix
      parallel:
        arch-review: [{ condition: approved }, { condition: needs_fix }]
        ai-antipattern-review:
          [{ condition: AI特有の問題なし }, { condition: AI特有の問題あり }]
        coding-review: [{ condition: approved }, { condition: needs_fix }]
        implementation-semantics-review:
          [{ condition: approved }, { condition: needs_fix }]
        contract-lifecycle-review:
          [{ condition: approved }, { condition: needs_fix }]
        robustness-review: [{ condition: approved }, { condition: needs_fix }]
        adr-conformance-review:
          [
            { condition: APPROVE },
            { condition: REJECT },
            { condition: NEEDS_ADR_REVISION },
          ]

  - name: final_gate
    uses: finding-contract-final-gate
    rules:
      - condition: COMPLETE
        next: spillover
      - condition: needs_review
        next: reviewers
      - condition: need_replan
        next: diagnose
      - condition: needs_fix
        next: fix
      - condition: needs_conflict_adjudication
        next: finding-conflict-adjudication
      - condition: ABORT
        next: ABORT

  - name: fix
    uses: fix
    policy:
      [
        coding,
        testing,
        existing-system-respect,
        tayk-traceability,
        tayk-scope-spillover,
        tayk-conflict-escalation,
        tayk-toolchain,
      ]
    knowledge: [takt, architecture, implementation-semantics, tayk-adr]
    rules:
      - condition: 修正完了
        next: reviewers
      - condition: 修正を進められない、または原因仮説の再検証が必要
        next: diagnose

  - name: spillover
    uses: tayk-spillover
    rules:
      - condition: 因果ありと判定した発見があり、今回の差分に含めるべきものが残っている
        next: diagnose
      - condition: gh issue の操作に失敗し、起票できなかった発見が残っている
        next: COMPLETE
      - condition: 仕分けが終わり、起票・追記・破棄をすべて記録した（発見ゼロの場合を含む）
        next: COMPLETE
