# PR の read-only 多角レビュー workflow。builtin review-takt-default の fork。
#
# 用途は 2 つ。issue-direct skill が作った PR（設計ゲート・実装レビューを一切通って
# いない）と、tayk-feature / tayk-fix が作った PR（内部ゲートを通過済み）の両方を
# 対象にする。前者にはレビュー工程が 1 つも無いため、この workflow が唯一の
# 仕様ゲートになる。
#
# fork した理由（builtin のままでは足りない 4 点）:
#
# 1. ADR 整合レビューが無い — ADR-0001 決定 7「黙って逸脱しない」を検査する担当が
#    builtin にはいない。tayk では規約遵守が自覚頼みでは運用されていないのと同じ
# 2. knowledge が `takt`（TAKT 本体開発向け）— tayk の architecture / adr / domain に
#    差し替える
# 3. 収束ポリシーが効いていない — tayk-review-convergence / tayk-review-rescan が
#    ブロッキングの範囲と再走査の義務を定める（ADR-0008 決定 6）
# 4. レビュー結果が .takt/runs/ の中に閉じる — publish が PR コメントへ貼る
#
# ループを内側に持たない（ADR-0008 決定 14）:
#   この workflow は read-only であり、指摘を直す手段を持たない。同じ対象を再レビュー
#   しても同じ結論に落ちるだけなので、レビュー ⇄ 修正のループは呼び出し側（issue-direct
#   skill / 人間）が持つ。結果として cycle が存在せず、loop_monitors も {step_iteration}
#   の自前上限も要らない —— ADR-0008 決定 6 が繰り返し苦しんできた「cycle の外から
#   再入されると loop monitor が発火しない」問題が、構造的に発生しない。
#   **遷移を足すときはこの前提を崩さないこと。** 後段から前段へ戻す rule を 1 本でも
#   足した時点で、上限の担保は max_steps だけになる。
#
# Finding Contract を使わない:
#   FC が持つ 3 つの価値（finding の同一性追跡 / レビュア間矛盾の調停 / ラウンド予算）の
#   うち、追跡と予算は 1 run 1 ラウンドのこの workflow では働かない。調停は 5 観点が
#   互いに独立（仕様・規約・AI 特有の劣化・コーディング・テスト）なため発生頻度が低く、
#   synthesis で足りる。ラウンドをまたぐ finding の同一性は PR コメントが担う —— 台帳は
#   run 内で閉じるが、PR コメントは次の run の gather が読める。
name: tayk-review
description: >
  PR の read-only 多角レビュー。PR 番号を受け取り、diff・linked issue の受入条件・
  前回レビューコメントを収集し、仕様適合 / ADR 整合 / AI アンチパターン / コーディング /
  テストの 5 並列でレビューして、結果を PR コメントとして貼る。コードは変更しない。
workflow_config:
  provider_options:
    codex:
      network_access: true
    opencode:
      network_access: true
# gather(1) + reviewers(1) + synthesis(1) + publish(1) = 4。ループが無いため
# 正常系は必ず 4 で終わる。倍を保険に取る
max_steps: 8
initial_step: gather

steps:
  # ── Phase 1: 対象の収集 ───────────────────────────────────────────
  # builtin gather-review の PR モードが土台。差分は「前回の tayk-review コメントを
  # 読む」ことで、これがラウンドをまたぐ finding 追跡の担体になる（decision 14）。
  - name: gather
    description: PR の diff・linked issue の受入条件・前回レビューコメントを収集する
    tags:
      - plan
    edit: false
    persona: planner
    knowledge:
      - tayk-domain
    # gh pr view / gh pr diff を使うため Bash が要る
    provider_options:
      extends: review-readonly
    instruction: tayk-review-gather
    quality_gates:
      - PR の diff と変更ファイル一覧を取得していること
      - linked issue を解決し、受入条件を列挙していること（解決できない場合はその旨を記録）
      - 前回の tayk-review コメントの有無を確認し、あればラウンド番号と未解消の指摘を
        引き継いでいること
    output_contracts:
      report:
        - name: review-target.md
          format: tayk-review-target
    rules:
      - condition: レビュー対象の情報収集完了
        next: reviewers
      - condition: PR を特定できない、diff を取得できない
        next: ABORT
        appendix: |
          確認事項:
          - {何が取得できなかったか}

  # ── Phase 2: 5 並列レビュー ───────────────────────────────────────
  # 観点の選定基準は「PR の出自を問わず適用できるか」。tayk-feature の impl_review が
  # 持つ architecture / implementation-semantics / contract-lifecycle / robustness は、
  # 実装工程の文脈（計画・テスト設計）を前提にする度合いが高いため外した。
  #
  # spec-conformance は issue-direct 発 PR にとって唯一の仕様ゲートであり、この
  # workflow の主役である。
  - name: reviewers
    description: 仕様適合 / ADR 整合 / AI アンチパターン / コーディング / テストの 5 並列レビュー
    tags:
      - review
    parallel:
      - name: spec-conformance
        tags:
          - review
        edit: false
        persona: tayk-spec-conformance-reviewer
        policy:
          - review
          - tayk-review-convergence
          - tayk-review-rescan
          - existing-system-respect
        knowledge:
          - tayk-domain
        provider_options:
          extends: review-readonly
        instruction: tayk-review-spec-conformance
        rules:
          - condition: approved
          - condition: needs_fix
        output_contracts:
          report:
            - name: spec-conformance-review.md
              format: tayk-spec-conformance-review

      - name: adr-conformance
        tags:
          - review
          - adr
        edit: false
        persona: tayk-adr-conformance-reviewer
        policy:
          - review
          - tayk-review-convergence
          - tayk-review-rescan
        knowledge:
          - tayk-adr
          - tayk-domain
        pass_previous_response: false
        provider_options:
          extends: review-readonly
        instruction: tayk-review-adr-conformance-impl
        rules:
          - condition: APPROVE
          - condition: REJECT
          - condition: NEEDS_ADR_REVISION
        output_contracts:
          report:
            - name: adr-conformance-review.md
              format: tayk-adr-conformance-review

      - name: ai-antipattern-review
        tags:
          - review
        edit: false
        persona: ai-antipattern-reviewer
        policy:
          - review
          - ai-antipattern
          - existing-system-respect
          - tayk-review-convergence
          - tayk-review-rescan
        pass_previous_response: false
        provider_options:
          extends: review-readonly
        instruction: ai-antipattern-review
        rules:
          - condition: approved
          - condition: needs_fix
        output_contracts:
          report:
            - name: ai-antipattern-review.md
              format: tayk-review-finding

      - name: coding-review
        tags:
          - review
        edit: false
        persona: coding-reviewer
        policy:
          - review
          - coding
          - existing-system-respect
          - tayk-review-convergence
          - tayk-review-rescan
        pass_previous_response: false
        provider_options:
          extends: review-readonly
        instruction: review-coding
        rules:
          - condition: approved
          - condition: needs_fix
        output_contracts:
          report:
            - name: coding-review.md
              format: tayk-review-finding

      - name: testing-review
        tags:
          - review
        edit: false
        persona: testing-reviewer
        policy:
          - review
          - testing
          - existing-system-respect
          - tayk-review-convergence
          - tayk-review-rescan
        knowledge:
          - unit-testing
          - e2e-testing
        pass_previous_response: false
        provider_options:
          extends: review-readonly
        instruction: review-test
        rules:
          - condition: approved
          - condition: needs_fix
        output_contracts:
          report:
            - name: testing-review.md
              format: tayk-review-finding

    # 合否は synthesis が決める。ここで all() / any() に分岐させると、reviewer の
    # verdict がどの宣言条件にも分類されなかったとき（分類器の失敗・空応答）に
    # 全 rule が外れて run ごと ABORT する（tayk-feature が #167 で踏んだ穴）。
    # 決定的に必ず前進させ、判定は台帳ではなくレポートを読む synthesis に一本化する
    rules:
      - condition: when(true)
        next: synthesis

  # ── Phase 3: 統合 ─────────────────────────────────────────────────
  # 各レビューのレポートを読み、ブロッキング / 非ブロッキングの 2 分類
  # （tayk-review-convergence）で仕分けて観点別に数える。判定行の数字が呼び出し側の
  # 自動修正の発火条件になるため、数え間違いはそのまま誤動作になる。
  - name: synthesis
    description: 5 レビューを統合し、観点別のブロッキング件数と総合判定を確定する
    tags:
      - review
      - supervise
    edit: false
    persona: supervisor
    policy:
      - review
      - tayk-review-convergence
    knowledge:
      - tayk-domain
    pass_previous_response: false
    provider_options:
      extends: review-readonly
    instruction: tayk-review-synthesis
    quality_gates:
      - Report Directory の 5 レビューレポートをすべて読み、収集元として記録していること
      - 観点別のブロッキング件数が、各レポートのブロッキング指摘表の行数と一致していること
      - 判定行が定められた 1 行形式（判定 / ブロッキング / 観点別内訳 / spec内訳 /
        非ブロッキング / 解消済み）で書かれていること
      - 判定行の spec内訳に、未実装 / 検証なし / 既出未解消 の件数と判定不能フラグが
        含まれていること（呼び出し側はこの内訳で人間へのエスカレーションを決める）
      - 前回コメントがある場合、解消済みとして数えた指摘に解消の証跡があること
    output_contracts:
      report:
        - name: review-summary.md
          format: tayk-review-summary
    rules:
      - condition: when(true)
        next: publish

  # ── Phase 4: PR への投稿 ──────────────────────────────────────────
  # この workflow 唯一の外部作用。gh issue create を使う spillover と同じ形
  # （edit: false のまま Bash で gh を叩く）。
  #
  # ブロッキング指摘が残っていても COMPLETE で終える（ADR-0008 決定 14）。
  # 「レビューする」という職務は果たしており、合否はコメント本文の判定行が持つ。
  # ABORT を合否に使うと、takt のキュー上で「実行に失敗した run」と
  # 「レビューに通らなかった PR」が区別できなくなる。
  - name: publish
    description: 統合レポートを PR コメントとして投稿する
    tags:
      - delivery
    edit: false
    persona: tayk-delivery-operator
    provider_options:
      extends: review-readonly
    session: refresh
    instruction: tayk-review-publish
    structured_output:
      schema_ref: tayk-review-publish
    quality_gates:
      - review-summary.md の本文をそのまま投稿していること（要約・改変をしていない）
      - コメント冒頭に PR 番号とラウンド番号を含む見出しと、機械可読な判定行があること
      - publication marker に Report Directory 由来の run ID が含まれていること
      - 投稿済み判定は現在の GitHub 認証主体と review-summary.md 本文全体の完全一致であること
      - コードを変更していないこと
      - gh の操作に失敗したなら、投稿できなかった理由と手動投稿用のコマンドを残していること
    rules:
      # posted は instruction が決定的 validator の出力だけを使って生成する。
      - condition: when(structured.publish.status == "posted")
        next: COMPLETE
      - condition: when(structured.publish.status == "failed")
        next: ABORT
        appendix: |
          手動投稿用のコマンド:
          - {gh pr comment のコマンド}
      - condition: when(true)
        next: ABORT
