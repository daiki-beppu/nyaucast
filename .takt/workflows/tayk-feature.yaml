name: tayk-feature
description: >
  tayk の機能開発 workflow。issue intake、要件と検証契約の計画、実装前の設計ゲート、
  test-first 実装、Finding Contract 付き専門レビュー、最終ゲート、spillover を行う。
  実装・レビュー・修正の基礎プロンプトは takt 0.55 の eject 済み step fragment を使う。
finding_contract:
  ledger_path: .takt/findings/tayk-feature.json
  raw_findings_path: .takt/findings/tayk-feature/raw
  manager:
    persona: findings-manager
    instruction: findings-manager
    output_contract: findings-manager
workflow_config:
  provider_options:
    codex:
      network_access: true
    opencode:
      network_access: true
max_steps: 50
initial_step: intake

loop_monitors:
  - cycle: [design_review, design_fix]
    threshold: 3
    judge:
      persona: supervisor
      instruction: tayk-loop-monitor-design
      rules:
        - condition: 健全（指摘が減っている・修正が実質的）
          next: design_review
        - condition: 非生産的（同じ指摘が繰り返される・要件が固まっていない）
          next: plan
  - cycle: [replan, implement]
    ignore_steps: [reviewers, final_gate, fix]
    threshold: 2
    judge:
      persona: supervisor
      instruction: loop-monitor-fix-replan
      rules:
        - condition: 要件と受入条件を変えずに実装方針を再定義できる
          next: replan
        - condition: 試行済みの再計画を踏まえても要件を満たす実現可能な方針がない
          next: ABORT
  - cycle: [fix, reviewers]
    ignore_steps: [final_gate]
    threshold: 3
    judge:
      persona: supervisor
      instruction: loop-monitor-reviewers-fix-fc
      rules:
        - condition: 修正進捗があり、報告内容が収束中で、次の修正が実行可能である
          next: fix
        - condition: 修正未完了または報告未収束で、再計画により解消できる見込みがある
          next: replan
        - condition: 試行済みの再計画を踏まえても要件を満たす実現可能な方針がない
          next: ABORT

steps:
  - name: intake
    kind: workflow_call
    call: tayk-intake
    rules:
      - condition: COMPLETE
        next: plan
      - condition: blocked
        next: ABORT
      - condition: ABORT
        next: ABORT

  - name: plan
    uses: implementation-high-plan-to-write-tests
    policy: [design-planning, tayk-traceability, tayk-toolchain]
    knowledge: [architecture, tayk-adr, tayk-domain]
    rules:
      - condition: タスク分析と計画が完了した
        next: test_design
      - condition: ユーザーが質問をしている（実装タスクではない）
        next: COMPLETE
      - condition: 要件が不明確で計画を立てられない
        next: ABORT

  - name: test_design
    description: 計画の completion contract ごとに検証方法を設計する
    tags: [plan, test-planning]
    edit: false
    persona: test-planner
    policy: [testing, tayk-traceability, tayk-toolchain]
    knowledge: [unit-testing, e2e-testing, tayk-domain]
    provider_options:
      extends: review-readonly
    instruction: tayk-test-design
    output_contracts:
      report:
        - name: test-design.md
          format: tayk-test-design
    rules:
      - condition: 全 completion contract に検証設計が対応づいた
        next: design_review
      - condition: 計画の要件が曖昧で検証設計できない
        next: plan

  - name: design_review
    description: 実装前に設計、ADR 整合性、検証設計を独立に審査する
    tags: [review, design-gate]
    parallel:
      - name: design-arch-review
        tags: [review, design-gate]
        edit: false
        session: compact
        persona: architecture-reviewer
        policy: [review, tayk-review-rescan, tayk-review-convergence]
        knowledge: [architecture, tayk-domain]
        provider_options:
          extends: review-readonly
        instruction: tayk-review-design-arch
        output_contracts:
          report:
            - name: design-review.md
              format: tayk-design-arch-review
        rules:
          - condition: APPROVE
          - condition: REJECT
          - condition: NEED_REPLAN
      - name: adr-conformance-design
        tags: [review, design-gate, adr]
        edit: false
        session: compact
        persona: tayk-adr-conformance-reviewer
        policy: [review, tayk-review-rescan, tayk-review-convergence]
        knowledge: [tayk-adr, tayk-domain]
        provider_options:
          extends: review-readonly
        instruction: tayk-review-adr-conformance-gate
        output_contracts:
          report:
            - name: adr-conformance-design.md
              format: tayk-adr-conformance-review
        rules:
          - condition: APPROVE
          - condition: REJECT
          - condition: NEEDS_ADR_REVISION
      - name: test-design-review
        tags: [review, design-gate]
        edit: false
        session: compact
        persona: testing-reviewer
        policy:
          [
            review,
            testing,
            tayk-traceability,
            tayk-review-rescan,
            tayk-review-convergence,
          ]
        knowledge: [unit-testing, e2e-testing]
        provider_options:
          extends: review-readonly
        instruction: tayk-review-test-design
        output_contracts:
          report:
            - name: test-design-review.md
              format: tayk-test-design-review
        rules:
          - condition: APPROVE
          - condition: REJECT
    rules:
      - condition: all("APPROVE")
        next: write_tests
      - condition: any("NEED_REPLAN")
        next: plan
      - condition: any("REJECT", "NEEDS_ADR_REVISION")
        next: design_fix
      - condition: when(true)
        next: design_review

  - name: design_fix
    description: 設計レビューの指摘だけを解消する
    tags: [plan, design-gate]
    edit: true
    session: compact
    persona: planner
    policy: [tayk-traceability, tayk-conflict-escalation]
    knowledge: [architecture, tayk-adr]
    required_permission_mode: edit
    provider_options:
      extends: edit
    instruction: tayk-gate-fix
    rules:
      - condition: 全 finding に対応した
        next: design_review
      - condition: 指摘が計画の前提そのものを否定している
        next: plan

  - name: write_tests
    uses: implementation-high-write-tests-to-implement
    policy: [coding, testing, tayk-traceability, tayk-toolchain]
    knowledge:
      [
        takt,
        architecture,
        unit-testing,
        e2e-testing,
        implementation-semantics,
        tayk-adr,
      ]
    rules:
      - condition: テスト作成が完了した
        next: implement
      - condition: 実装対象が未実装のためテスト作成をスキップ
        next: implement
      - condition: テスト作成を進行できない
        next: design_fix
      - condition: ユーザー入力が必要
        next: write_tests
        requires_user_input: true
        interactive_only: true

  - name: implement
    tags: [coding]
    edit: true
    session: compact
    persona: coder
    policy:
      [coding, testing, tayk-traceability, tayk-scope-spillover, tayk-toolchain]
    knowledge:
      [takt, architecture, implementation-semantics, tayk-adr, tayk-domain]
    required_permission_mode: edit
    instruction: implement
    rules:
      - condition: 実装完了
        next: reviewers
      - condition: 実装を進められない
        next: replan

  - name: replan
    uses: implementation-high-replan-to-implement
    policy: [design-planning, tayk-traceability, tayk-toolchain]
    knowledge: [architecture, tayk-adr, tayk-domain]
    rules:
      - condition: プロジェクト内で実行可能な未試行の変更または原因調査と、その検証手順を具体化した
        next: implement
      - condition: 確認済みの根拠により、プロジェクト内の変更や調査では解消できず、外部操作だけが残るか要件が両立不能である
        next: ABORT

  - name: reviewers
    uses: reviewers
    rules:
      self:
        - condition: when(findings.conflicts.count > 0 && findings.conflicts.unadjudicated.count > 0)
          next: finding-conflict-adjudication
        - condition: when(findings.conflicts.count > 0)
          next: ABORT
        - condition: when(findings.provisional.count > 0 && findings.conflicts.count == 0)
          next: replan
        - condition: all("approved", "AI特有の問題なし", "approved", "approved", "approved", "approved", "APPROVE") && when(findings.open.count == 0 && findings.provisional.count == 0 && findings.conflicts.count == 0)
          next: final_gate
        - condition: any("approved", "needs_fix", "AI特有の問題なし", "AI特有の問題あり", "APPROVE", "REJECT", "NEEDS_ADR_REVISION") && when(findings.open.count == 0 && findings.provisional.count == 0 && findings.conflicts.count == 0 && findings.reviewerAnomalies.count > 0)
          next: final_gate
        - condition: any("needs_fix", "AI特有の問題あり", "REJECT", "NEEDS_ADR_REVISION") && when(findings.conflicts.count == 0)
          next: fix
        - condition: when(findings.conflicts.count == 0 && findings.open.count > 0)
          next: fix
      parallel:
        arch-review: [{ condition: approved }, { condition: needs_fix }]
        ai-antipattern-review:
          [{ condition: AI特有の問題なし }, { condition: AI特有の問題あり }]
        coding-review: [{ condition: approved }, { condition: needs_fix }]
        implementation-semantics-review:
          [{ condition: approved }, { condition: needs_fix }]
        contract-lifecycle-review:
          [{ condition: approved }, { condition: needs_fix }]
        robustness-review: [{ condition: approved }, { condition: needs_fix }]
        adr-conformance-review:
          [
            { condition: APPROVE },
            { condition: REJECT },
            { condition: NEEDS_ADR_REVISION },
          ]

  - name: final_gate
    uses: finding-contract-final-gate
    rules:
      - condition: COMPLETE
        next: spillover
      - condition: needs_review
        next: reviewers
      - condition: need_replan
        next: replan
      - condition: needs_fix
        next: fix
      - condition: needs_conflict_adjudication
        next: finding-conflict-adjudication
      - condition: ABORT
        next: ABORT

  - name: fix
    uses: fix
    policy:
      [
        coding,
        testing,
        tayk-traceability,
        tayk-scope-spillover,
        tayk-conflict-escalation,
        tayk-toolchain,
      ]
    knowledge: [takt, architecture, implementation-semantics, tayk-adr]
    rules:
      - condition: 修正完了
        next: reviewers
      - condition: 修正を進められない、または実装方針の再定義が必要
        next: replan

  - name: spillover
    uses: tayk-spillover
    rules:
      - condition: 因果ありと判定した発見があり、今回の差分に含めるべきものが残っている
        next: plan
      - condition: gh issue の操作に失敗し、起票できなかった発見が残っている
        next: COMPLETE
      - condition: 仕分けが終わり、起票・追記・破棄をすべて記録した（発見ゼロの場合を含む）
        next: COMPLETE
