name: tayk-feature
description: >
  tayk の機能開発 workflow。issue intake、要件と検証契約の計画、実装前の設計ゲート、
  requirement scenario 付き test-first 実装、専門レビューと指摘裁定、検証付き修正、
  要件充足の最終ゲート、spillover を行う。
capabilities: readonly
max_steps: 50
initial_step: intake

loop_monitors:
  - cycle: [design_review, design_fix]
    threshold: 3
    judge:
      persona: supervisor
      instruction: tayk-loop-monitor-design
      rules:
        - condition: 健全（指摘が減っている・修正が実質的）
          next: design_review
        - condition: 非生産的（同じ指摘が繰り返される・要件が固まっていない）
          next: plan
  - cycle: [replan, implement]
    ignore_steps: [peer_review]
    threshold: 2
    judge:
      persona: supervisor
      instruction: loop-monitor-fix-replan
      rules:
        - condition: 要件と受入条件を変えずに実装方針を再定義できる
          next: replan
        - condition: 試行済みの再計画を踏まえても要件を満たす実現可能な方針がない
          next: ABORT
steps:
  - name: intake
    kind: workflow_call
    call: tayk-intake
    rules:
      - condition: COMPLETE
        next: plan
      - condition: blocked
        next: ABORT
      - condition: ABORT
        next: ABORT

  - name: plan
    uses: implementation-high-plan-to-write-tests
    policy:
      [contract-change, design-planning, tayk-traceability, tayk-toolchain]
    knowledge: [architecture, tayk-adr, tayk-domain]
    rules:
      - condition: タスク分析と計画が完了した
        next: test_design
      - condition: ユーザーが質問をしている（実装タスクではない）
        next: COMPLETE
      - condition: 要件が不明確で計画を立てられない
        next: ABORT

  - name: test_design
    description: 計画の completion contract ごとに検証方法を設計する
    tags: [plan, test-planning]
    edit: false
    persona: test-planner
    policy: [testing, tayk-traceability, tayk-toolchain]
    knowledge: [unit-testing, e2e-testing, tayk-domain]
    capabilities: readonly
    instruction: tayk-test-design
    output_contracts:
      report:
        - name: test-design.md
          format: tayk-test-design
    rules:
      - condition: 全 completion contract に検証設計が対応づいた
        next: design_review
      - condition: 計画の要件が曖昧で検証設計できない
        next: plan

  - name: design_review
    description: 実装前に設計、ADR 整合性、検証設計を独立に審査する
    tags: [review, design-gate]
    parallel:
      - name: design-arch-review
        tags: [review, design-gate]
        edit: false
        session: compact
        persona: architecture-reviewer
        policy: [review, tayk-review-rescan, tayk-review-convergence]
        knowledge: [architecture, tayk-domain]
        capabilities: readonly
        instruction: tayk-review-design-arch
        output_contracts:
          report:
            - name: design-review.md
              format: tayk-design-arch-review
        rules:
          - condition: APPROVE
          - condition: REJECT
          - condition: NEED_REPLAN
      - name: adr-conformance-design
        tags: [review, design-gate, adr]
        edit: false
        session: compact
        persona: tayk-adr-conformance-reviewer
        policy: [review, tayk-review-rescan, tayk-review-convergence]
        knowledge: [tayk-adr, tayk-domain]
        capabilities: readonly
        instruction: tayk-review-adr-conformance-gate
        output_contracts:
          report:
            - name: adr-conformance-design.md
              format: tayk-adr-conformance-review
        rules:
          - condition: APPROVE
          - condition: REJECT
          - condition: NEEDS_ADR_REVISION
      - name: test-design-review
        tags: [review, design-gate]
        edit: false
        session: compact
        persona: testing-reviewer
        policy:
          [
            review,
            testing,
            tayk-traceability,
            tayk-review-rescan,
            tayk-review-convergence,
          ]
        knowledge: [unit-testing, e2e-testing]
        capabilities: readonly
        instruction: tayk-review-test-design
        output_contracts:
          report:
            - name: test-design-review.md
              format: tayk-test-design-review
        rules:
          - condition: APPROVE
          - condition: REJECT
    rules:
      - condition: all("APPROVE")
        next: write_tests
      - condition: any("NEED_REPLAN")
        next: plan
      - condition: any("REJECT", "NEEDS_ADR_REVISION")
        next: design_fix
      - condition: when(true)
        next: design_review

  - name: design_fix
    description: 設計レビューの指摘だけを解消する
    tags: [plan, design-gate]
    edit: true
    session: compact
    persona: planner
    policy: [tayk-traceability, tayk-conflict-escalation]
    knowledge: [architecture, tayk-adr]
    required_permission_mode: edit
    capabilities: edit
    instruction: tayk-gate-fix
    rules:
      - condition: 全 finding に対応した
        next: design_review
      - condition: 指摘が計画の前提そのものを否定している
        next: plan

  - name: write_tests
    uses: implementation-high-write-tests-to-implement
    policy:
      [contract-change, coding, testing, tayk-traceability, tayk-toolchain]
    knowledge:
      [
        takt,
        architecture,
        unit-testing,
        e2e-testing,
        implementation-semantics,
        tayk-adr,
      ]
    rules:
      - condition: テスト作成が完了した
        next: implement
      - condition: 実装対象が未実装のためテスト作成をスキップ
        next: implement
      - condition: テスト作成を進行できない
        next: design_fix
      - condition: ユーザー入力が必要
        next: write_tests
        requires_user_input: true
        interactive_only: true

  - name: implement
    tags: [coding]
    edit: true
    session: compact
    persona: coder
    policy:
      [coding, testing, tayk-traceability, tayk-scope-spillover, tayk-toolchain]
    knowledge:
      [takt, architecture, implementation-semantics, tayk-adr, tayk-domain]
    required_permission_mode: edit
    instruction: implement
    rules:
      - condition: 実装完了
        next: peer_review
      - condition: 実装を進められない
        next: replan

  - name: replan
    uses: implementation-high-replan-to-implement
    policy:
      [contract-change, design-planning, tayk-traceability, tayk-toolchain]
    knowledge: [architecture, tayk-adr, tayk-domain]
    instruction: tayk-replan-implementation
    output_contracts:
      report:
        - name: plan.md
          format: tayk-replan-decision
    rules:
      - condition: プロジェクト内で実行可能な未試行の変更または原因調査と、その検証手順を具体化した
        next: implement
      - condition: 確認済みの根拠により、プロジェクト内の変更や調査では解消できず、外部操作だけが残るか要件が両立不能である
        next: replan_abort_review

  - name: replan_abort_review
    description: replan の ABORT 候補と本文・根拠を独立に照合する
    tags: [review, plan]
    edit: false
    session: compact
    persona: supervisor
    policy: [review, tayk-traceability, tayk-toolchain]
    knowledge: [architecture, tayk-adr, tayk-domain]
    capabilities: readonly
    instruction: tayk-replan-abort-review
    output_contracts:
      report:
        - name: replan-abort-review.md
          format: tayk-replan-abort-review
    rules:
      - condition: ABORT_CONFIRMED
        next: preserve_abort_worktree
      - condition: REPLAN_REQUIRED
        next: implement

  - name: preserve_abort_worktree
    description: ABORT 前の作業ツリーと回収手順を run report に記録する
    tags: [report]
    edit: false
    session: compact
    persona: tayk-delivery-operator
    policy: [tayk-traceability, tayk-toolchain]
    knowledge: [tayk-domain]
    capabilities: readonly
    instruction: tayk-preserve-abort-worktree
    output_contracts:
      report:
        - name: abort-worktree-recovery.md
          format: tayk-abort-worktree-recovery
    rules:
      - condition: when(true)
        next: ABORT

  - name: peer_review
    kind: workflow_call
    call: peer-review
    args:
      review_policy_additions:
        [tayk-review-rescan, tayk-review-convergence, tayk-traceability]
      review_knowledge_additions:
        [
          architecture,
          takt,
          unit-testing,
          e2e-testing,
          implementation-semantics,
          tayk-adr,
          tayk-domain,
        ]
      plan_policy: [coding, testing, review, tayk-traceability, tayk-toolchain]
      fix_policy:
        [
          coding,
          testing,
          tayk-traceability,
          tayk-scope-spillover,
          tayk-conflict-escalation,
          tayk-toolchain,
        ]
      fix_knowledge:
        [takt, architecture, implementation-semantics, tayk-adr, tayk-domain]
      verification_policy:
        [coding, testing, review, tayk-traceability, tayk-toolchain]
      verification_knowledge:
        [
          takt,
          architecture,
          unit-testing,
          e2e-testing,
          implementation-semantics,
          tayk-adr,
          tayk-domain,
        ]
      final_gate_instruction: scenario-based-supervise-review-resolution
    rules:
      - condition: COMPLETE
        next: spillover
      - condition: need_replan
        next: replan
      - condition: ABORT
        next: ABORT

  - name: spillover
    uses: tayk-spillover
    rules:
      - condition: 因果ありと判定した発見があり、今回の差分に含めるべきものが残っている
        next: plan
      - condition: gh issue の操作に失敗し、起票できなかった発見が残っている
        next: COMPLETE
      - condition: 仕分けが終わり、起票・追記・破棄をすべて記録した（発見ゼロの場合を含む）
        next: COMPLETE
